<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Credisim — simulate the true cost of a mortgage or consumer loan: monthly payment, TAEG, insurance, fees, notary costs, legal checks. English & French." />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews (WhatsApp, Telegram, iMessage, Slack, X). The image URL must be absolute; bump ?v= when the image changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Credisim" />
    <meta property="og:url" content="https://creditsimulator.web.app/" />
    <meta property="og:title" content="Credisim — loan simulator" />
    <meta property="og:description" content="Simulate the true cost of a mortgage or consumer loan: monthly payment, TAEG, insurance, fees and notary costs." />
    <meta property="og:image" content="https://creditsimulator.web.app/og.jpg?v=1" />
    <meta property="og:image:secure_url" content="https://creditsimulator.web.app/og.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Credisim logo with a sample monthly payment card" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Credisim — loan simulator" />
    <meta name="twitter:description" content="Simulate the true cost of a mortgage or consumer loan: monthly payment, TAEG, insurance, fees and notary costs." />
    <meta name="twitter:image" content="https://creditsimulator.web.app/og.jpg?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Apple devices use SF Pro; Inter is the closest match elsewhere. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>Credisim — loan simulator</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { const th = localStorage.getItem('credisim.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (_) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
